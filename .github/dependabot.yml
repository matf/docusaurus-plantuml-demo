version: 2

updates:
  # One pull request for every npm update, never two. Merging a dependency bump here redeploys
  # the live site, so the automation should never have to reason about two of them racing.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
    # Bump the declared range, not just the lockfile. This site exists to demonstrate a specific
    # plugin version, so `package.json` should name the version actually being demonstrated —
    # under the default strategy a `^1.5.0` range silently absorbs every 1.5.x release and the
    # manifest never moves.
    versioning-strategy: increase
    # Dependabot withholds a new version for three days by default. That is a real supply-chain
    # guard when updates merge themselves — it closes the window in which a compromised release is
    # taken minutes after publication — so it stays in place for everything we do not publish.
    # It is pointless for our own package: this site exists to demonstrate the current plugin, the
    # releases come from our own pipeline with npm provenance attested, and a three-day lag is
    # precisely the staleness this configuration is meant to remove.
    cooldown:
      default-days: 3
      exclude:
        - '@matfsw/*'
    groups:
      # No `update-types` filter, deliberately: majors join the group instead of spawning a second
      # pull request. `.github/workflows/dependabot-auto-merge.yml` then declines to merge that
      # pull request and says which dependency is holding it, so a major is reviewed rather than
      # merged — and still visible. A major that can never be taken belongs in an `ignore:` entry
      # here, with a note saying what breaks.
      all:
        applies-to: version-updates
        patterns: ['*']
      all-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # TypeScript 7 removes `baseUrl`, and `@docusaurus/tsconfig` — which this site extends —
      # still sets it, so `tsc --noEmit` refuses to run at all: "Option 'baseUrl' has been
      # removed." Deleting `baseUrl` from this repository's own tsconfig.json does not help; the
      # option arrives from the package, which was verified by trying it. Left un-ignored it would
      # sit in the grouped pull request forever, holding back the updates that *are* takeable.
      # Revisit when Docusaurus ships a tsconfig without `baseUrl`.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # A different ecosystem, so Dependabot cannot fold it into the npm pull request above.
  # Scheduling it a day later keeps the two from overlapping in practice; if they ever do, the
  # `refresh` job in dependabot-auto-merge.yml brings the second up to date after the first lands.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: tuesday
      time: '04:00'
      timezone: Europe/Zurich
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
