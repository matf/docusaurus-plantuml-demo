# Every dependency update arrives as a pull request and merges itself once this passes, so this
# workflow is the only thing standing between a bad bump and the live site. It builds the site
# exactly as `deploy.yml` does and asserts the PlantUML runtime was emitted.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_FUND: 'false'
  NPM_CONFIG_AUDIT: 'false'

jobs:
  build:
    name: Type check and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Fail if the PlantUML runtime was not emitted
        run: npm run verify:assets

  # One stable context for the branch ruleset to require, so adding a job here never means
  # editing the ruleset, and a job removed from this workflow cannot silently stop being required.
  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [build]
    steps:
      - name: Fail unless every CI job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"
          node -e '
            const needs = JSON.parse(process.env.RESULTS);
            const failed = Object.entries(needs).filter(([, job]) => job.result !== "success");
            if (failed.length > 0) {
              for (const [name, job] of failed) console.error(`${name}: ${job.result}`);
              process.exit(1);
            }
            console.log("Every CI job succeeded.");
          '
